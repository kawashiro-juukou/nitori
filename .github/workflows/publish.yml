name: Publish

# Tags are plain versions (v0.1.0); every package in pkgs/ carries that same
# version, so this workflow publishes each package that is not marked
# `publish_to: none`.
on:
  push:
    tags:
      - "v[0-9]+\\.[0-9]+\\.[0-9]+*"

permissions:
  contents: read

jobs:
  # dart-lang/setup-dart's reusable publish.yml handles the OIDC trusted
  # publishing flow for pub.dev. Each job publishes one package.
  publish_core:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_core

  publish_message:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_message

  publish_client:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_client

  publish_server:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_server

  publish_nitori:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori