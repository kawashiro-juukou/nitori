name: Publish

# Tags are per-package versions (e.g. nitori_core-v0.1.15). Normally they are
# created by the Release workflow (tool/release.sh) on master and dispatched
# here with `workflow_dispatch --ref <tag>`; they can also be pushed manually.
# Each job publishes only the package whose tag prefix matches the ref.
# dart-lang/setup-dart's reusable publish.yml handles the OIDC trusted
# publishing flow for pub.dev, which is bound to the tag ref.
on:
  workflow_dispatch:
  push:
    tags:
      - 'nitori-v*'
      - 'nitori_client-v*'
      - 'nitori_core-v*'
      - 'nitori_message-v*'
      - 'nitori_server-v*'

permissions:
  contents: read

jobs:
  publish_nitori:
    if: startsWith(github.ref, 'refs/tags/nitori-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori

  publish_nitori_client:
    if: startsWith(github.ref, 'refs/tags/nitori_client-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_client

  publish_nitori_core:
    if: startsWith(github.ref, 'refs/tags/nitori_core-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_core

  publish_nitori_message:
    if: startsWith(github.ref, 'refs/tags/nitori_message-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_message

  publish_nitori_server:
    if: startsWith(github.ref, 'refs/tags/nitori_server-v')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1.8.1
    with:
      working-directory: pkgs/nitori_server