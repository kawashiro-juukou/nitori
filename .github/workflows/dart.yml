# Created with package:mono_repo v6.9.0
name: Dart CI
on:
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/dart.yml
      - mono_repo.yaml
      - analysis_options.yaml
      - "**/mono_pkg.yaml"
      - "pkgs/nitori/**"
      - "pkgs/nitori_client/**"
      - "pkgs/nitori_core/**"
      - "pkgs/nitori_message/**"
      - "pkgs/nitori_server/**"
      - "!**/*.md"
  pull_request:
    paths:
      - .github/workflows/dart.yml
      - mono_repo.yaml
      - analysis_options.yaml
      - "**/mono_pkg.yaml"
      - "pkgs/nitori/**"
      - "pkgs/nitori_client/**"
      - "pkgs/nitori_core/**"
      - "pkgs/nitori_message/**"
      - "pkgs/nitori_server/**"
      - "!**/*.md"
  schedule:
    - cron: "0 0 * * 0"
defaults:
  run:
    shell: bash
env:
  PUB_ENVIRONMENT: bot.github
permissions:
  contents: read

jobs:
  job_001:
    name: mono_repo self validate
    runs-on: ubuntu-latest
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:stable"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: stable
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: mono_repo self validate
        run: dart pub global activate mono_repo 6.9.0
      - name: mono_repo self validate
        run: dart pub global run mono_repo generate --validate
  job_002:
    name: analyze_and_format; linux; Dart 3.2.0
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: [pkgs/nitori, pkgs/nitori_client, pkgs/nitori_core, pkgs/nitori_message, pkgs/nitori_server]
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0;package:${{ matrix.package }}"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0;package:${{ matrix.package }}
            os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: "3.2.0"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pub upgrade
        run: dart pub upgrade
      - name: analyze
        run: dart analyze --fatal-infos .
      - name: format
        run: dart format --output=none --set-exit-if-changed .
  job_003:
    name: unit_test; linux; Dart 3.2.0
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: [pkgs/nitori, pkgs/nitori_client, pkgs/nitori_core, pkgs/nitori_message, pkgs/nitori_server]
    steps:
      - name: Cache Pub hosted dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: "~/.pub-cache/hosted"
          key: "os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0;package:${{ matrix.package }}"
          restore-keys: |-
            os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0;package:${{ matrix.package }}
            os:ubuntu-latest;pub-cache-hosted;sdk:3.2.0
            os:ubuntu-latest;pub-cache-hosted
            os:ubuntu-latest
      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d
        with:
          sdk: "3.2.0"
      - id: checkout
        name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: pub upgrade
        run: dart pub upgrade
      - name: test
        run: dart test
