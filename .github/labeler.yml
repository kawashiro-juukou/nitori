# This configures the .github/workflows/pull_request_labeler.yml workflow.
# Format follows actions/labeler v5+ (see https://www.schemastore.org/pull-request-labeler.json).

infra:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - tool/**

test:
  - changed-files:
      - any-glob-to-any-file: pkgs/*/test/**

package:nitori:
  - changed-files:
      - any-glob-to-any-file: pkgs/nitori/**

package:nitori_core:
  - changed-files:
      - any-glob-to-any-file: pkgs/nitori_core/**

package:nitori_client:
  - changed-files:
      - any-glob-to-any-file: pkgs/nitori_client/**

package:nitori_server:
  - changed-files:
      - any-glob-to-any-file: pkgs/nitori_server/**

package:nitori_message:
  - changed-files:
      - any-glob-to-any-file: pkgs/nitori_message/**
