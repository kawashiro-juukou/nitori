# Local development overrides. Pub reads this file for `dart pub get`
# but never publishes it, so pub.dev sees only the hosted constraints in
# pubspec.yaml. This is the official replacement for `dependency_overrides`
# in a published package.
dependency_overrides:
  nitori_core:
    path: ../nitori_core
  nitori_server:
    path: ../nitori_server
