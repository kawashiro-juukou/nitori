name: nitori_monorepo
description: Root workspace for the Nitori monorepo.
publish_to: none

environment:
  sdk: ^3.9.0

repository: https://github.com/kawashiro-juukou/nitori

workspace:
  - pkgs/nitori
  - pkgs/nitori_client
  - pkgs/nitori_core
  - pkgs/nitori_message
  - pkgs/nitori_server

dev_dependencies:
  lints: ^6.1.0
  test: ^1.24.0
  melos: ^8.0.0

melos:
  command:
    bootstrap:
      runPubGetInParallel: true
    version:
      mode: independent
      linkToCommits: true
      updateChangelog: true
      updateDependentsConstraints: true
      updateDependentsVersions: true
      smartDependents: true
      fetchTags: true
  scripts:
    analyze:
      exec: dart analyze --fatal-infos .
      packageFilters:
        dirExists: lib
    test:
      exec: dart test
      packageFilters:
        fileExists: pubspec.yaml
    format:
      exec: dart format --output=none --set-exit-if-changed .
      packageFilters:
        dirExists: lib